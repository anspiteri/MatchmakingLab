[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matchmakinglab"
version = "1.0.0"
description = "A framework for prototyping competitive matchmaking algorithms."
authors = [{ name = "An Spiteri" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
	"click",
	"textual"
]

[project.optional-dependencies]
dev = [
    "pytest",
	"pytest-mock",
    "pytest-cov"
]

[project.scripts]
matchmakinglab = "matchmakinglab.cli:cli"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
# Ignores F841 (Unused variable) globally
ignore = ["F841"]

[tool.pyrefly]
# Disables unused local variable warnings and hints
disable-unused-local = true

[tool.coverage.run]
source = ["matchmakinglab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
